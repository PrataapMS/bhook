name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Search for biryani in Indiranagar\n2. Tap Menu and prices\n3. ..."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Pixel 8, Chrome 140 (installed PWA)
  - type: dropdown
    id: data
    attributes:
      label: Data mode
      options: [Demo data, Real data, Not sure]
