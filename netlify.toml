[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Cancel every Git-triggered Netlify build (incl. previews). Production deploys
  # go only through the approved GitHub Actions workflow (netlify deploy --build).
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"

[dev]
  framework = "#custom"
  command = "vite"
  targetPort = 5173
  port = 8888

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
